<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الخبرات السابقة | آدم إسماعيل</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏊</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page-title="experiencePage.title">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-header">
    <div class="container">
      <span class="page-crumb" data-i18n="nav.home">الرئيسية</span>
      <h1 data-i18n="experiencePage.title">الخبرات السابقة</h1>
      <p data-i18n="experiencePage.subtitle">مسيرة حافلة</p>
    </div>
  </section>

  <section class="section section-sand" style="padding-top:56px;">
    <div class="container" style="max-width:880px;">
      <div class="timeline" id="timelineList"></div>

      <div class="extra-experience">
        <h3 id="extraTitle">خبرات ومهام إضافية</h3>
        <ul class="extra-grid" id="extraList"></ul>
      </div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script>
function renderPageContent(lang){
  const timeline = SITE_DATA.experienceTimeline[lang];
  document.getElementById('timelineList').innerHTML = timeline.map(item => `
    <div class="timeline-item">
      <span class="timeline-period">${item.period}</span>
      <h3>${item.org}</h3>
      <div class="role">${item.role}</div>
      <p>${item.text}</p>
    </div>
  `).join('');

  const extra = SITE_DATA.experienceExtra[lang];
  document.getElementById('extraTitle').textContent = extra.title;
  document.getElementById('extraList').innerHTML = extra.items.map(i => `<li>${i}</li>`).join('');
}
window.renderPageContent = renderPageContent;
</script>
</body>
</html>
