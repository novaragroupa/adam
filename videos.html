<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الفيديوهات | آدم إسماعيل</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏊</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page-title="videosPage.title">

<header class="site-header" id="site-header"></header>

<main>
  <section class="page-header">
    <div class="container">
      <span class="page-crumb" data-i18n="nav.home">الرئيسية</span>
      <h1 data-i18n="videosPage.title">الفيديوهات</h1>
      <p data-i18n="videosPage.subtitle">مقاطع من التدريب</p>
    </div>
  </section>

  <section class="section section-sand" style="padding-top:56px;">
    <div class="container">
      <div class="grid-3" id="videosGrid"></div>
    </div>
  </section>
</main>

<footer class="site-footer" id="site-footer"></footer>

<script src="js/translations.js"></script>
<script src="js/main.js"></script>
<script>
function renderPageContent(lang){
  const list = SITE_DATA.videos[lang];
  document.getElementById('videosGrid').innerHTML = list.map(v => `
    <div class="card video-card" onclick="openVideoLightbox('${v.src}', '${escapeStr(v.title)}', '${escapeStr(v.desc)}')">
      <div class="card-media">
        <img src="${v.thumb}" alt="${v.title}" loading="lazy">
        <div class="play-badge"><span>▶</span></div>
      </div>
      <div class="card-body">
        <h3>${v.title}</h3>
        <p>${v.desc}</p>
      </div>
    </div>
  `).join('');
}
function escapeStr(s){ return (s||'').replace(/'/g, "\\'"); }
window.renderPageContent = renderPageContent;
</script>
</body>
</html>
